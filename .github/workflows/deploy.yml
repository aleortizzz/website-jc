name: Deploy a Ferozo (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ferozo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir por FTP a public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # La cuenta FTP w1750584@jcherrajes.com ya cae dentro de /public_html/
          server-dir: ./
          # TEMPORAL: borra todo lo que haya en public_html antes de subir (para limpiar
          # la web vieja de jcherrajes en el primer deploy). Quitar esta línea una vez
          # confirmado que el sitio nuevo carga bien — deja los deploys incrementales.
          dangerous-clean-slate: true
          # Archivos que NO se suben al hosting (tooling, docs internas, temporales)
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            **/node_modules/**
            PROYECTO.md
            notes.txt
            package.json
            package-lock.json
            postcss.config.js
            tailwind.config.js
            src/input.css
            .gitignore
            .gitattributes
            _*
